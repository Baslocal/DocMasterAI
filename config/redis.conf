# DocMaster — Redis 7 Configuration
# Location: /etc/redis/redis.conf (or /opt/docmaster/config/redis.conf)
# STRICT RULES:
#   - Bind to 127.0.0.1 ONLY — never expose to network
#   - requirepass is MANDATORY — password stored in dm.env
#   - maxmemory-policy allkeys-lru for job queue management

# ── Network — localhost only ───────────────────────────────────────────────
bind 127.0.0.1
port 6379
protected-mode yes

# MANDATORY: Set to the same value as REDIS_PASSWORD in dm.env
# Generate with: openssl rand -base64 32
requirepass CHANGE_ME_BEFORE_FIRST_BOOT

# ── Memory ────────────────────────────────────────────────────────────────
maxmemory 512mb
# allkeys-lru: evict least-recently-used keys when memory limit reached
# Appropriate for job queue — completed jobs are the least recently accessed
maxmemory-policy allkeys-lru

# ── Persistence — both RDB and AOF ────────────────────────────────────────
# RDB snapshots
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /opt/docmaster/queue/

# AOF persistence — ensures no job loss on crash
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Logging ────────────────────────────────────────────────────────────────
loglevel notice
logfile /opt/docmaster/logs/redis.log

# ── Performance ────────────────────────────────────────────────────────────
hz 10
dynamic-hz yes
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no

# ── Security ──────────────────────────────────────────────────────────────
# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "DM_CONFIG_RESTRICTED"
